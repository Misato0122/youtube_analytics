name: 急上昇データの収集

on:
  schedule:
    - cron: '7 22 * * *'   # 毎日 7:07（日本時間）
    - cron: '7 10 * * *'   # 毎日 19:07（日本時間）。同じ日のデータは上書き
  workflow_dispatch:
    inputs:
      target:
        description: '何を集めるか'
        type: choice
        default: all
        options: [all, trending, small, knowledge, games]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 急上昇を取得
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'trending'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect.py --region JP
      - name: 小規模チャンネルの伸びている動画を取得（1日1回）
        if: (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'small')) || github.event.schedule == '7 22 * * *'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect_small.py --profile general --max-subs 5000
      - name: 知識・解説系の横動画（小規模チャンネル）を取得（1日1回）
        if: (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'knowledge')) || github.event.schedule == '7 22 * * *'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect_small.py --profile knowledge --max-subs 5000
      - name: 建築・クラフト系ゲームの横動画を取得（手動実行のみ）
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'games'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect_small.py --profile games --max-subs 1000000000
      - name: データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Tokyo date +%F) のデータ"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
