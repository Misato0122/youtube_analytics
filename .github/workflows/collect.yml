name: データの収集

on:
  schedule:
    - cron: '7 22 * * *'   # 毎日 7:07（日本時間）に小規模チャンネル2種とゲームのデータを収集（API 約8,200ユニット/日）
  workflow_dispatch:
    inputs:
      target:
        description: '何を集めるか（small=小規模チャンネル2種＋ゲーム, trending=急上昇, games=ゲームだけ, all=全部）'
        type: choice
        default: small
        options: [small, trending, games, all]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 急上昇を取得
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'trending' || inputs.target == 'all')
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect.py --region JP
      - name: 小規模チャンネルの伸びている動画を取得
        if: github.event_name == 'schedule' || inputs.target == 'small' || inputs.target == 'all'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect_small.py --profile general --max-subs 5000
      - name: 知識・解説系の横動画（小規模チャンネル）を取得
        if: github.event_name == 'schedule' || inputs.target == 'small' || inputs.target == 'all'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect_small.py --profile knowledge --max-subs 5000
      - name: 建築・クラフト系ゲームの横動画を取得
        if: github.event_name == 'schedule' || inputs.target == 'small' || inputs.target == 'games' || inputs.target == 'all'
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/collect_small.py --profile games --max-subs 1000000000
      - name: データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Tokyo date +%F) のデータ"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
